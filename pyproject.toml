[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "scientific-computing-toolkit"
version = "1.0.0"

description = """
A modular Python toolkit for signal analysis,
curve fitting and Monte Carlo simulation.
"""

requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]